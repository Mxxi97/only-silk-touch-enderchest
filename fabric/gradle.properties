# Gradle settings for the Fabric build only. A `-p fabric` invocation treats this
# directory as the build root, so the root gradle.properties is NOT read here --
# the org.gradle.* performance settings are duplicated, while the mod properties
# (mod_id, mod_version, ...) are loaded from ../gradle.properties by build.gradle
# so they cannot drift from the other loaders.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Unlike the other loaders, Fabric has THREE version inputs. All of them are
# defaults for local development; CI overrides them per target with -P flags from
# versions.json (targets[].minecraft, targets[].fabric, fabric_loader).
minecraft_version=26.3
fabric_api_version=0.161.0+26.3
loader_version=0.19.5

loom_version=1.17-SNAPSHOT
