# Gradle settings for the MinecraftForge build only. A `-p forge` invocation treats
# this directory as the build root, so the root gradle.properties is NOT read here
# -- the org.gradle.* performance settings are duplicated, while the mod properties
# (mod_id, mod_version, ...) are loaded from ../gradle.properties by build.gradle so
# they cannot drift from the other loaders.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
# ForgeGradle is not fully configuration-cache clean yet, so its own MDK ships
# problems=warn rather than the default failure. Matching that keeps the cache
# benefit without turning a ForgeGradle internal into a build failure.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

net.minecraftforge.gradle.merge-source-sets=true

# The full Forge coordinate, "<minecraft>-<forge>". Like the NeoForge build this is
# the only version axis: the Minecraft version, the mappings and the Java toolchain
# are all derived from it. CI overrides it per target from versions.json with
# -Pforge_version=...
forge_version=1.21.11-61.2.1

## Universal jar compatibility ranges (maven syntax)
minecraft_version_range=[1.21.1,)
forge_version_range=[52,)
# One jar spans several FML majors, so the loader range is deliberately open --
# this is what Forge's own 1.21.1 MDK ships.
loader_version_range=[0,)
