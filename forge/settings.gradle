// A standalone Gradle build, NOT a subproject of the root: ForgeGradle and
// ModDevGradle each rewire the Minecraft dependency for a whole build and cannot
// share one. Invoke from the repo root with the shared wrapper:
//   ./gradlew -p forge build
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'only-silk-touch-enderchest-forge'
