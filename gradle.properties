# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# 4G because decompiling Minecraft is memory-hungry, especially on the 26.x targets.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment Properties
# The ModDevGradle plugin version. Resolved in settings.gradle.
moddev_version=2.0.147
# The NeoForge version to build against. This is the ONLY version axis for this
# build: the Minecraft version, the Java toolchain and the mod metadata ranges are
# all derived from it in build.gradle. Override per build with -Pneo_version=...
# The full set of supported versions lives in versions.json at the repo root.
neo_version=26.3.0.7-beta

## Universal jar compatibility ranges
# One jar per loader covers every supported version, so these are declared ranges
# rather than the version the jar happened to be compiled against. They must not
# claim more than the build matrix in versions.json has actually proven: widen the
# lower bound only when dropping old versions, and leave the upper bound open only
# because the matrix re-verifies every new release before anything is published.
minecraft_version_range=[1.21.1,)
neo_version_range=[21.1,)
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[4,)

## Mod Properties
# The unique mod identifier. Must be lowercase in English locale and fit [a-z][a-z0-9_]{1,63}.
# Must match SilkTouch.MOD_ID in common/java.
mod_id=only_silk_touch_enderchest
# The human-readable display name for the mod.
mod_name=Only Silk Touch Enderchest
# The license of the mod. Review your options at https://choosealicense.com/.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=1.0.0
# The group ID for the mod. Matches the base package used for the mod sources.
mod_group_id=drHirsch
# The authors of the mod, for display in the mod list.
mod_authors=DrHirsch
# The description of the mod.
mod_description=Ender chests can only be mined with a Silk Touch tool, so you never shatter one by accident.
